# deploy/openresty-site.conf —— 1Panel/OpenResty 站点配置
#
# 安装到服务器：
#   sudo cp /home/ubuntu/wh40k/deploy/openresty-site.conf /opt/1panel/www/conf.d/wh40k.conf
#   sudo docker exec 1Panel-openresty-CMak nginx -t          # 先验语法
#   sudo docker exec 1Panel-openresty-CMak nginx -s reload   # 再热重载（别 restart，会断其他站）
#
# 结构（同源，前端不需要跨域）：
#   http://49.232.104.101:8100/       → 静态站（Next 静态导出产物）
#   http://49.232.104.101:8100/api/*  → 反代到 127.0.0.1:8210 的 FastAPI
#
# ⚠ 两个前提，改动前先确认还成立：
#   1. openresty 容器是 NetworkMode=host，所以 127.0.0.1 就是宿主机回环（已验证）
#   2. 8100 需在腾讯云安全组放行，否则只有本机能访问
#
# 路径映射：宿主机 /opt/1panel/www/conf.d ↔ 容器 /usr/local/openresty/nginx/conf/conf.d
#           宿主机 /opt/1panel/www/sites   ↔ 容器 /www/sites

server {
    listen 8100;
    server_name _;
    root /www/sites/wh40k/index;
    index index.html;

    # 规则书衍生内容，别让搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # ── API 反代 ──────────────────────────────────────────────
    # 末尾斜杠会把 /api 前缀剥掉：/api/codex/factions → /codex/factions
    location /api/ {
        proxy_pass http://127.0.0.1:8210/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /chat 是 SSE 流：必须关缓冲，否则事件被攒着一次性吐出来
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # 模拟器/点评是蒙特卡洛重活，给足时间（后端自己有 20000 次上限与并发闸）
        proxy_send_timeout 300s;
    }

    # ── 静态站 ────────────────────────────────────────────────
    # Next 静态导出产出 /codex.html 这类文件，所以 try_files 必须带 $uri.html，
    # 否则访问 /codex 会 404 到 index.html（页面能开但路由不对）
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存；html 不缓存，免得改版后看到旧壳子
    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|jpg|jpeg|png|webp|ico|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control public;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
